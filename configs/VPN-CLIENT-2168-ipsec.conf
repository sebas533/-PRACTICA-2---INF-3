# strongSwan - cliente IPsec Remote Access (IKEv1 aggressive + PSK + XAUTH)
# Ajustar leftid / lado remoto a lo que tengas en el equipo real.

config setup
    charondebug="ike 2, knl 2, cfg 2"

conn VPN-REMOTE-2168
    keyexchange=ikev1
    aggressive=yes
    authby=xauthpsk
    xauth=client
    xauth_identity=vpn2168
    left=%defaultroute
    leftid=@VPN-CLIENT-2168
    leftsourceip=%config
    right=192.168.11.2
    rightsubnet=10.21.68.130/32
    ike=des-md5-modp1536,des-sha1-modp1536!
    esp=des-md5,des-sha1!
    ikelifetime=1d
    keylife=12h
    auto=add
