# Extracto funcional del FortiGate (FGVMK6 7.0.9) - Practica 2, Infraestructura 3
# Sanitizado: sin PSK, sin contrasenas de usuarios ni administradores, sin certificados.

config system interface
    edit "port1"
        set vdom "root"
        set ip 21.68.3.2 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "WAN-ISP"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set type physical
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.11.2 255.255.255.0
        set allowaccess ping https http
        set type physical
    next
    edit "VLAN10-USERS"
        set vdom "root"
        set ip 10.21.68.1 255.255.255.128
        set allowaccess ping
        set device-identification enable
        set role lan
        set interface "port2"
        set vlanid 10
    next
    edit "VPN-REMOTE-2168"
        set vdom "root"
        set type tunnel
        set interface "port3"
    next
end

config system dhcp server
    edit 2
        set default-gateway 10.21.68.1
        set netmask 255.255.255.128
        set interface "VLAN10-USERS"
        config ip-range
            edit 1
                set start-ip 10.21.68.10
                set end-ip 10.21.68.100
            next
        end
        set dns-server1 8.8.8.8
        set dns-server2 1.1.1.1
    next
end

config firewall address
    edit "WEB-SV-2168"
        set subnet 10.21.68.130 255.255.255.255
    next
    edit "VPN-REMOTE-2168_range"
        set type iprange
        set start-ip 10.212.135.10
        set end-ip 10.212.135.20
    next
end

config firewall addrgrp
    edit "VPN-REMOTE-2168_split"
        set member "WEB-SV-2168"
    next
end

config user local
    edit "vpn2168"
        set type password
        set passwd <OMITIDO>
    next
end

config user group
    edit "SSLVPN-USER-2168"
        set member "vpn2168"
    next
end

config vpn ipsec phase1-interface
    edit "VPN-REMOTE-2168"
        set type dynamic
        set interface "port3"
        set mode aggressive
        set peertype any
        set net-device disable
        set mode-cfg enable
        set proposal des-md5 des-sha1
        set wizard-type dialup-forticlient
        set xauthtype auto
        set authusrgrp "SSLVPN-USER-2168"
        set ipv4-start-ip 10.212.135.10
        set ipv4-end-ip 10.212.135.20
        set ipv4-netmask 255.255.255.0
        set dns-mode auto
        set ipv4-split-include "VPN-REMOTE-2168_split"
        set save-password enable
        set psksecret <OMITIDO>
    next
end

config vpn ipsec phase2-interface
    edit "VPN-REMOTE-2168"
        set phase1name "VPN-REMOTE-2168"
        set proposal des-md5 des-sha1
    next
end

config firewall policy
    edit 3
        set name "DENY-DIRECT-SSH-WEB"
        set srcintf "VLAN10-USERS"
        set dstintf "port1"
        set srcaddr "VLAN10-USERS address"
        set dstaddr "WEB-SV-2168"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 1
        set name "USER-TO-INTERNET"
        set srcintf "VLAN10-USERS"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 4
        set name "vpn_VPN-REMOTE-2168_remote_0"
        set srcintf "VPN-REMOTE-2168"
        set dstintf "port1"
        set action accept
        set srcaddr "VPN-REMOTE-2168_range"
        set dstaddr "WEB-SV-2168"
        set schedule "always"
        set service "SSH"
        set logtraffic all
        set nat enable
    next
end

config router static
    edit 1
        set gateway 21.68.3.1
        set device "port1"
    next
end
